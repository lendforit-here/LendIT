<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alerts | LendIT</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Syne:wght@700&display=swap" rel="stylesheet">

  <link rel="icon" type="image/png" href="../images/favicon.png">
  <link rel="stylesheet" href="../shared.css">
  <link rel="stylesheet" href="alerts.css">

  <script src="../transition.js"></script>
</head>
<body>
  <script src="../shared.js"></script>

  <main class="bp-main">
    <section class="alerts" id="alerts">
      <h1 class="bp-title">ALERTS</h1>

      <div class="filter-container">
        <div class="filter-label">VIEW:</div>

        <select id="viewSelect" class="view-select" aria-label="Alert view">
          <option value="inbox">Inbox</option>
          <option value="archived">Archived</option>
        </select>

        <div class="filter-buttons" role="group" aria-label="Alert views">
          <button type="button" class="tab is-active" data-view="inbox" aria-pressed="true">Inbox</button>
          <button type="button" class="tab" data-view="archived" aria-pressed="false">Archived</button>
        </div>

        <div class="toolbar-end">
          <div class="legend">
            <span><i class="dot dot--unread"></i>Unread</span>
            <span><i class="dot dot--read"></i>Read</span>
          </div>
          <button type="button" id="markAll" class="btn-mark">Mark all as read</button>
        </div>
      </div>

      <div class="alert-panel">
        <ul id="alertList" class="alert-list" aria-live="polite"></ul>
        <p id="status" class="status" role="status"></p>
      </div>

      <nav class="pagination" id="pagination" aria-label="Alerts pages"></nav>
    </section>
  </main>

  <!-- Undo toast -->
  <div id="toast" class="toast" role="status" aria-live="polite" hidden>
    <span id="toastMsg"></span>
    <button type="button" id="toastUndo" class="toast__undo">Undo</button>
  </div>

  <!-- Modals -->
  <dialog id="alertModal" class="modal" aria-labelledby="modalMsg">
    <div class="modal__panel">
      <button type="button" class="modal__close" id="modalClose" aria-label="Close alert">&times;</button>
      <time id="modalTime" class="modal__time"></time>
      <p id="modalMsg" class="modal__msg"></p>
      <div class="modal__actions">
        <a id="modalLink" class="modal__go" href="../borrows/borrows.html">View details</a>
        <button type="button" class="modal__dismiss" id="modalDismiss">Close</button>
      </div>
    </div>
  </dialog>

  <dialog id="confirmModal" class="modal modal--confirm" aria-labelledby="confirmMsg">
    <div class="modal__panel">
      <p class="modal__warn">Caution</p>
      <p id="confirmMsg" class="modal__msg">Are you sure you want to mark all alerts as read?</p>
      <div class="modal__actions">
        <button type="button" class="modal__go" id="confirmYes">Yes, mark all</button>
        <button type="button" class="modal__dismiss" id="confirmNo">Cancel</button>
      </div>
    </div>
  </dialog>

  <!-- Load items-data.js before alerts.js -->
  <script src="../items-data.js"></script>
  <script src="alerts.js"></script>
</body>
</html>
